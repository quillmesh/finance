# Live-App (Branch main)  → https://quillmesh.github.io/finance/
# Test-App (Branch test)  → https://quillmesh.github.io/finance/test/
#
# Bei jedem Push auf main oder test wird der gepushte Stand geprüft und getestet.
# Schlägt ein Test fehl, wird NICHTS veröffentlicht.
# Veröffentlicht wird immer aus main (GitHub Pages erlaubt standardmässig nur main):
#   - Push auf main  → testen, dann ganze Website bauen und veröffentlichen
#   - Push auf test  → testen, dann diesen Workflow auf main anstossen (ohne erneute Tests)
# Die Website enthält immer beide Apps: Live aus main, Test aus test.
name: Veröffentlichen

on:
  push:
    branches: [main, test]
  workflow_dispatch:
    inputs:
      nur_bauen:
        description: 'Tests überspringen (bereits beim Push gelaufen)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.nur_bauen }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vor der ersten Freigabe enthält main nur einen Platzhalter ohne App: dann gibt es nichts zu testen
      - name: App vorhanden?
        id: app
        run: if [ -f src/main.ts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        if: steps.app.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Typen prüfen
        if: steps.app.outputs.ok == 'true'
        run: bunx -p typescript@5.8.3 tsc -p .
      - name: Unit-Tests
        if: steps.app.outputs.ok == 'true'
        run: bun test
        env:
          CI: 'true'
      - name: Playwright-Browser aus dem Zwischenspeicher
        if: steps.app.outputs.ok == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-chromium-${{ runner.os }}
      - name: Playwright installieren
        if: steps.app.outputs.ok == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: End-to-End-Tests
        if: steps.app.outputs.ok == 'true'
        run: npx playwright test
        env:
          CI: 'true'
      # Bei einem Fehler: Bericht und Traces zum Herunterladen (Actions → Lauf → Artifacts).
      - name: Bericht und Traces sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Push auf test: nach bestandenen Tests die Veröffentlichung auf main anstossen
  anstossen:
    needs: test
    if: ${{ github.ref == 'refs/heads/test' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run veroeffentlichen.yml --repo "$GITHUB_REPOSITORY" --ref main -f nur_bauen=true
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: test
          path: test
      - uses: oven-sh/setup-bun@v2
      - name: Website bauen (Live aus main, Test aus test)
        run: live/scripts/build-site.sh "$PWD/live" "$PWD/test"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/site

  deploy:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
